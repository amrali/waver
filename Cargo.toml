[package]
name = "waver"
description = "waver: waveform generation library"
version = "0.2.0"
authors = ["Amr Ali <amralicc@gmail.com>"]
license = "Apache-2.0"
homepage = "https://github.com/amrali/waver/"
categories = ["no-std", "multimedia::audio", "science", "embedded"]
keywords = ["signal-processing", "waveform", "wave-generator", "wave"]
exclude = [".gitignore", ".cargo/config", ".github"]
readme = "README.md"
edition = "2021"
resolver = "2"

[dependencies]
libm = "0.2"
num-traits = { version = "0.2", default-features = false }
num-complex = { version = "0.4", default-features = false, features = ["libm"] }
rustfft = { version = "6.4", default-features = false }

[dev-dependencies]
doc-comment = "0.3"
hound = "3.5"

[features]
# Optional diagnostic tests that are expensive and produce verbose output
# Usage: cargo test --features diagnostics
diagnostics = []

[profile.release]
lto = true
panic = 'abort'
